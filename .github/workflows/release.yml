name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.21'

      - name: Build binaries
        run: make build-all

      - name: Create release archives
        run: make release

      - name: Generate checksums
        run: make checksums

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: dist/releases/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Creating the release above with GITHUB_TOKEN does not emit a `release`
  # event, so the tap workflow cannot rely on that trigger. Call it directly
  # instead, which needs no personal access token.
  homebrew:
    name: Update Homebrew Tap
    needs: build
    uses: ./.github/workflows/update-homebrew.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
