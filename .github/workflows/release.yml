name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build and Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Read the version from go.mod rather than pinning it here. The pinned
          # 1.21 no longer matched go.mod's 1.24.7, and setup-go v6 tightened
          # toolchain selection, so a stale pin can fail instead of quietly
          # upgrading.
          go-version-file: go.mod

      - name: Build binaries
        run: make build-all

      - name: Create release archives
        run: make release

      - name: Generate checksums
        run: make checksums

      - name: Create Release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/releases/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Creating the release above with GITHUB_TOKEN does not emit a `release`
  # event, so the tap workflow cannot rely on that trigger. Call it directly
  # instead, which needs no personal access token.
  homebrew:
    name: Update Homebrew Tap
    needs: build
    uses: ./.github/workflows/update-homebrew.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit

  # Skips itself when CHOCO_API_KEY is unset, so releases stay green until the
  # key is configured.
  chocolatey:
    name: Publish to Chocolatey
    needs: build
    uses: ./.github/workflows/publish-chocolatey.yml
    with:
      tag: ${{ github.ref_name }}
    secrets: inherit
